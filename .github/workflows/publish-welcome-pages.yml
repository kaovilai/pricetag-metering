name: Publish Welcome page

on:
  push:
    branches: [main]
    paths:
      - "internal/dashboard/welcome.html"
      - "tools/build-welcome-page.py"
      - ".github/workflows/publish-welcome-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      WELCOME_GATEWAY_URL: https://api.enmaas.devshift.net
      WELCOME_DASHBOARD_URL: https://dashboard.enmaas.devshift.net
      MONTHLY_TOKEN_QUOTA: "10000000000"
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build static Welcome page
        run: python3 tools/build-welcome-page.py

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
